apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx-app
spec:
  replicas: 3                              # Number of Pod replicas
  selector:  
    matchLabels:
      app: nginx-app                       # Must match Pod template labels
  template:
    metadata:
      labels: 
        app: nginx-app
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.25.3-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"