apiVersion: v1
kind: Namespace
metadata:
  name: dev-team
  labels:
    env: development
    team: backend
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: dev-team          # Deploy this Pod in the dev-team namespace
  labels:
    app: nginx-app
spec:
  containers:
    - name: nginx-container
      image: nginx:1.25.3-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"
