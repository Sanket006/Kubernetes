apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx-app
spec:
  containers:
    - name: nginx-container
      image: nginx:1.25.3-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  labels:
    app: nginx-app
spec: 
  selector:
    app: nginx-app                    # This label must match the Pod label
  ports:
    - protocol: TCP
      port: 80                        # Port exposed by the Service
      targetPort: 80                  # Port inside the container
  type: NodePort                      # Exposes Service on Node IP