apiVersion: v1
kind: Pod
metadata: 
  name: my-pod
spec:
  containers:
    - name: nginx-container
      image: nginx:1.25.3-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"   